[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voicebox"
version = "0.2.10"
description = "Self-hosted OpenAI-compatible speech server (STT + streaming TTS)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "av==18.0.0",
  "fastapi==0.140.0",
  "uvicorn[standard]==0.51.0",
  "python-multipart==0.0.32",
  "faster-whisper==1.2.1",
  "huggingface-hub==1.24.0",
  "httpx==0.28.1",
  "kokoro-onnx==0.5.0",
  "piper-tts==1.6.0",
  "soundfile==0.14.0",
  "numpy==2.4.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.0"]

[project.scripts]
voicebox = "voicebox.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "clients/voice-chat", "clients/claude-code"]
testpaths = ["tests", "clients/voice-chat", "clients/claude-code"]
markers = [
  "latency: host-sensitive latency benchmark",
  "model: requires local model weights and inference runtime",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep pre-0.16 defaults; ruff 0.16 enables a much larger rule set by default.
select = ["E4", "E7", "E9", "F"]
